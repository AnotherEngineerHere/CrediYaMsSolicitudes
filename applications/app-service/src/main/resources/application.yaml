server:
  port: 8082
spring:
  application:
    name: "CrediYaMsSolictudes"
  devtools:
    add-properties: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: ${APP_DB_HOST}
    port: ${APP_DB_PORT}
    database: ${APP_DB_NAME}
    schema: core
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
logging:
  level:
    org.springframework.data.r2dbc: DEBUG
app:
  jwt:
    secret: "d1UqRjMSI9She0oFsvhG/PIV1A/NN1Ke9RTohM/vVfE55Kle3Defav4aNLH01O7ocomXcnwXAAKqur8bg7CHdA=="
    issuer: "crediya-auth"
services:
  auth:
    url: ${SERVICES_AUTH_URL}
