server:
  port: 8082
spring:
  application:
    name: "CrediYaMsSolictudes"
  devtools:
    add-properties: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: crediya
    schema: core
    username: admin
    password: admin123
logging:
  level:
    org.springframework.data.r2dbc: DEBUG
